<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo – TSS The Swift Store</title>
<meta name="description" content="Página do jogo na TSS The Swift Store.">
<meta name="theme-color" content="#0d0c07">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>

:root{--gold:#e6cf4a;--gold2:#c9b53d;--bg:#0d0c07;--panel:#171509;--panel2:#1d1a0c;--line:#2d2910;--text:#efe9c8;--mute:#a49d74;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#3a3210 0,transparent 60%);background-repeat:no-repeat;color:var(--text);font:400 1rem/1.65 "Segoe UI",system-ui,Arial,sans-serif;min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.75rem clamp(1rem,4vw,3rem);background:rgba(13,12,7,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(45,41,16,.8)}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:800;letter-spacing:.12em;text-decoration:none;line-height:1.1}
.brand svg{width:34px;height:34px;fill:var(--gold);filter:drop-shadow(0 0 8px rgba(230,207,74,.45))}
.brand small{display:block;font-size:.6rem;color:var(--gold);letter-spacing:.35em;font-weight:400}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:.2rem 1.2rem}
nav a{color:var(--mute);text-decoration:none;font-weight:600;font-size:.95rem;transition:color .15s}
nav a:hover{color:var(--gold)}
nav a.pill{border:1px solid var(--gold2);color:var(--gold);padding:.3rem .9rem;border-radius:999px}
nav a.pill:hover{background:var(--gold);color:#141108}
.hero{position:relative;isolation:isolate;text-align:center;padding:4.5rem 1rem 3rem;max-width:900px;margin:0 auto}
.hero::before{content:"";position:absolute;z-index:-1;left:50%;top:-2rem;width:min(900px,140%);height:520px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(230,207,74,.17),transparent);pointer-events:none}
.hero .star{width:104px;fill:var(--gold);filter:drop-shadow(0 0 26px rgba(230,207,74,.55));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}
.hero h1{margin:.5rem 0 0;font-size:clamp(3.2rem,13vw,5.8rem);letter-spacing:.14em;line-height:1;background:linear-gradient(180deg,#fff6bf,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero h1 span{display:block;margin:.9rem -.5em 0 0;font-size:clamp(.72rem,2.6vw,1.02rem);letter-spacing:.5em;font-weight:600;text-transform:uppercase;background:none;-webkit-text-fill-color:var(--gold);color:var(--gold)}
.hero p.lead{color:var(--mute);max-width:36rem;margin:1.4rem auto 1.8rem;font-size:1.05rem}
.hero p.lead b{color:var(--text)}
.btn{display:inline-block;background:linear-gradient(180deg,#f2dc62,var(--gold));color:#141108;font-weight:800;text-decoration:none;padding:.85rem 1.7rem;border-radius:12px;border:0;cursor:pointer;font-size:1rem;font-family:inherit;box-shadow:0 6px 22px rgba(230,207,74,.22);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(230,207,74,.34)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;margin-left:.5rem}
.btn.ghost:hover{border-color:var(--gold2);color:var(--gold)}
.btn.off{opacity:.45;pointer-events:none;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-top:1.8rem}
.chips span{border:1px solid var(--line);background:rgba(23,21,9,.7);color:var(--mute);font-size:.78rem;padding:.35rem .85rem;border-radius:999px}
main{max-width:1120px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem) 4rem}
h2{display:flex;align-items:center;gap:1rem;font-size:.85rem;letter-spacing:.32em;color:var(--gold);margin:3.2rem 0 1.3rem;font-weight:700}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1.4rem}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-4px);border-color:var(--gold2);box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px rgba(230,207,74,.12)}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#1d1a0b}
.ph::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(23,21,9,.95));pointer-events:none}
.badge{position:absolute;z-index:1;top:.7rem;right:.7rem;background:rgba(13,12,7,.82);border:1px solid var(--gold2);color:var(--gold);font-weight:800;font-size:.8rem;padding:.2rem .65rem;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card .b{padding:1.1rem 1.25rem 1.3rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.card h3{margin:0;font-size:1.25rem;line-height:1.25}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tags span{background:var(--line);color:var(--mute);font-size:.62rem;font-weight:700;padding:.15rem .5rem;border-radius:5px;letter-spacing:.08em}
.card p{margin:0;color:var(--mute);font-size:.92rem;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.5rem}
.meta small{color:var(--mute)}
.sk{min-height:360px;background:linear-gradient(100deg,var(--panel) 30%,#211e0d 50%,var(--panel) 70%);background-size:200% 100%;animation:sh 1.4s linear infinite;border:1px solid var(--line);border-radius:18px}
@keyframes sh{to{background-position:-200% 0}}
#msg{display:none;color:var(--mute);text-align:center;padding:2rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem;transition:border-color .18s}
.how div:hover{border-color:var(--gold2)}
.how b{display:grid;place-items:center;width:2.2rem;height:2.2rem;margin-bottom:.7rem;border-radius:50%;background:rgba(230,207,74,.12);border:1px solid var(--gold2);color:var(--gold);font-size:1rem}
.about p{color:var(--mute);max-width:46rem;margin:0 0 1rem}
.about p b,.about p a{color:var(--text)}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:.7rem;transition:border-color .18s}
details[open]{border-color:var(--gold2)}
summary{cursor:pointer;padding:1rem 1.2rem;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--gold);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0;padding:0 1.2rem 1.1rem;color:var(--mute)}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:2rem 1rem 3rem;border-top:1px solid var(--line)}
footer a{color:var(--gold);text-decoration:none}
footer a:hover{text-decoration:underline}
.preco{font-weight:700;color:var(--gold)}
@media (max-width:560px){.btn.ghost{margin:.6rem 0 0}.hero{padding-top:3rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

.wrap{max-width:1040px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,3rem) 4rem}
.crumb{font-size:.85rem;color:var(--mute);margin:1rem 0}
.crumb a{color:var(--gold);text-decoration:none}
.top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.6rem;align-items:start}
@media(max-width:780px){.top{grid-template-columns:1fr}}
.cap img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;border:1px solid var(--line);background:#1d1a0b;display:block}
.side{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:1.3rem;display:flex;flex-direction:column;gap:.8rem}
.side h1{margin:0;font-size:1.6rem;line-height:1.2}
.side dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font-size:.9rem}
.side dt{color:var(--mute)}.side dd{margin:0}
.side .price{font-size:1.5rem;font-weight:800;color:var(--gold)}
.side .btn{text-align:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.4rem}
.box p{margin:0 0 .8rem;color:var(--mute)}.box p:last-child{margin:0}
.box ul{margin:0;padding-left:1.2rem;color:var(--mute)}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:.8rem}
.shots img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;transition:border-color .15s}
.shots a:hover img{border-color:var(--gold2)}
.log{border-left:2px solid var(--line);padding-left:1rem;margin:0 0 1rem}
.log b{color:var(--gold)}
#err{display:none;text-align:center;padding:3rem 1rem;color:var(--mute)}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="TSS The Swift Store - início"><svg viewBox="-70 -70 140 140" aria-hidden="true"><polygon points="0,-60 13.47,-18.54 57.06,-18.54 21.8,7.08 35.27,48.54 0,22.92 -35.27,48.54 -21.8,7.08 -57.06,-18.54 -13.47,-18.54"/></svg><span>TSS<small>THE SWIFT STORE</small></span></a>
  <nav aria-label="Principal"><a href="/#jogos">Jogos</a><a href="/#novidades">Novidades</a><a href="/#hub">TSS Hub</a><a href="/resgatar">Resgatar chave</a><a href="/conta">Minha conta</a><a class="pill" href="https://discord.gg/h5pD7XCMAf" target="_blank" rel="noopener">Discord</a></nav>
</header>
<div class="wrap">
  <p class="crumb"><a href="/#jogos">← Todos os jogos</a></p>
  <div id="err"></div>
  <div id="page" aria-live="polite"><div class="sk"></div></div>
</div>
<footer>© TSS The Swift Store · Desenvolvedor @TS_KKJJ · <a href="https://discord.gg/h5pD7XCMAf" target="_blank" rel="noopener">Comunidade no Discord</a><br><a href="/termos">Termos de Uso</a> · <a href="/privacidade">Privacidade</a> · <a href="/reembolso">Reembolso (7 dias)</a> · <a href="/conta">Minha conta</a></footer>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c==='"'?"&quot;":"&#39;"})}
function safe(u){return /^(https:\/\/|\/|[a-z0-9_\-.\/]+$)/i.test(u||"")?u:""}
function fmtPreco(p){var n=Number(p);if(!Number.isFinite(n)||n<=0)return"Grátis";return"R$ "+n.toFixed(2).replace(".",",")}
function comprar(jogo,preco,nome){location.href="/pagar.html?jogo="+encodeURIComponent(jogo)+"&preco="+encodeURIComponent(preco||0)+"&nome="+encodeURIComponent(nome||"")}
function lista(v){return Array.isArray(v)?v:(typeof v==="string"&&v.trim()?v.split(/\r?\n/).filter(Boolean):[])}
function ytId(u){var m=String(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);return m?m[1]:""}
/* A descricao do catalogo mistura texto e requisitos: separa o bloco que comeca com Recomendado/Requisitos/Minimo. */
function partirDescricao(g){
  var paras=String(g.description||"").split(/\n\s*\n/).map(function(p){return p.trim()}).filter(Boolean),txt=[],req=[];
  paras.forEach(function(p){
    var linhas=p.split(/\n/).filter(function(l){return !/^#\s/.test(l.trim())}).map(function(l){return l.trim()}).filter(Boolean);
    if(!linhas.length)return;
    if(/^(recomendado|requisitos|m[ií]nimo)/i.test(linhas[0])){req=req.concat(linhas)}else{txt.push(linhas.join(" "))}
  });
  return{txt:txt,req:lista(g.requisitos).length?lista(g.requisitos):req};
}
function acao(g){
  if(g.download_url)return'<a class="btn" href="'+esc(safe(g.download_url))+'">Baixar</a>';
  if(!g.protegido&&g.disponivel)return'<a class="btn" href="/api/baixar-gratis?jogo='+encodeURIComponent(g.id)+'">Baixar grátis</a>';
  if(g.protegido)return'<button class="btn" id="buy">'+(Number(g.preco)>0?"Comprar Pix":"Obter grátis (teste)")+'</button>';
  return"<small>Em breve</small>";
}
function changelog(g){
  var c=g.changelog;
  if(Array.isArray(c)&&c.length)return c.map(function(x){return'<div class="log"><b>v'+esc(x.version||"")+'</b>'+(x.date?' · <small>'+esc(x.date)+'</small>':"")+'<br>'+esc(x.notes||x.notas||"")+'</div>'}).join("");
  if(typeof c==="string"&&c.trim())return'<div class="log"><b>v'+esc(g.version)+'</b><br>'+esc(c).replace(/\n/g,"<br>")+'</div>';
  return"<p>Ainda sem notas de versão. Acompanhe as novidades na comunidade do Discord.</p>";
}
function pintar(g){
  var d=partirDescricao(g),tags=(g.tags||[]).map(function(t){return"<span>"+esc(t)+"</span>"}).join("");
  var vid=ytId(g.trailer),shots=lista(g.screenshots).map(safe).filter(Boolean);
  document.title=g.name+" – TSS The Swift Store";
  var md=document.querySelector('meta[name=description]');if(md)md.content=(d.txt[0]||g.name).slice(0,155);
  var h='<div class="top"><div class="cap"><img src="'+esc(safe(g.capsule_url))+'" alt="'+esc(g.name)+' - capa do jogo" width="640" height="360"></div>'
   +'<aside class="side"><h1>'+esc(g.name)+'</h1><div class="tags">'+tags+'</div>'
   +'<div class="price">'+(g.protegido?fmtPreco(g.preco):"Grátis")+'</div>'
   +'<dl><dt>Versão</dt><dd>'+esc(g.version)+'</dd>'+(g.size_mb?'<dt>Tamanho</dt><dd>'+esc(g.size_mb)+' MB</dd>':"")+'<dt>Desenvolvedor</dt><dd>'+esc(g.developer||"TS_KKJJ")+'</dd><dt>Plataforma</dt><dd>PC (Windows) via TSS Hub</dd></dl>'
   +acao(g)+'</aside></div>';
  if(vid)h+='<h2>TRAILER</h2><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+vid+'" title="Trailer de '+esc(g.name)+'" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
  if(shots.length)h+='<h2>CAPTURAS DE TELA</h2><div class="shots">'+shots.map(function(u,i){return'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="Captura de tela '+(i+1)+' de '+esc(g.name)+'" loading="lazy"></a>'}).join("")+'</div>';
  h+='<h2>SOBRE O JOGO</h2><div class="box">'+(d.txt.length?d.txt.map(function(p){return"<p>"+esc(p)+"</p>"}).join(""):"<p>Descrição em breve.</p>")+'</div>';
  if(d.req.length)h+='<h2>REQUISITOS DO PC</h2><div class="box"><ul>'+d.req.map(function(l){return"<li>"+esc(l)+"</li>"}).join("")+'</ul></div>';
  h+='<h2>NOTAS DE VERSÃO</h2><div class="box">'+changelog(g)+'</div>';
  if(/terror/i.test((g.tags||[]).join(" ")))h+='<p style="font-size:.85rem;color:var(--mute);margin-top:1.2rem">Aviso: jogos de terror podem ter sustos, sons altos e luzes piscantes. Pessoas com epilepsia fotossensível devem consultar um médico antes de jogar.</p>';
  document.getElementById("page").innerHTML=h;
  var b=document.getElementById("buy");if(b)b.onclick=function(){comprar(g.id,Number(g.preco)||0,g.name)};
}
function erro(t){document.getElementById("page").innerHTML="";var e=document.getElementById("err");e.style.display="block";e.textContent=t}
var id=new URLSearchParams(location.search).get("id")||"";
if(!id){erro("Jogo não informado. Volte à lista de jogos.")}else{
  fetch("/api/catalogo",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})
  .catch(function(){return fetch("/catalog.json",{cache:"no-cache"}).then(function(r){return r.json()})})
  .then(function(d){
    var g=(d.games||[]).filter(function(x){return x.id===id})[0];
    if(!g||g.disponivel!==true){erro("Esse jogo não está disponível na loja agora.");return}
    pintar(g);
  }).catch(function(){erro("Não consegui carregar o jogo agora. Tente de novo em instantes.")});
}
</script>
<script src="/legal.js" defer></script>
</body>
</html>
