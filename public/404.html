<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada – TSS The Swift Store</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0c07">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root{--gold:#e6cf4a;--bg:#0d0c07;--line:#2d2910;--text:#efe9c8;--mute:#a49d74;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#3a3210 0,transparent 60%);background-repeat:no-repeat;color:var(--text);font:400 1rem/1.6 "Segoe UI",system-ui,Arial,sans-serif;text-align:center}
.n{font-size:clamp(4rem,18vw,8rem);font-weight:800;line-height:1;color:var(--gold);letter-spacing:.05em}
h1{margin:.5rem 0;font-size:1.4rem}
p{color:var(--mute);margin:.3rem 0 1.4rem}
a.b{display:inline-block;background:linear-gradient(180deg,#f2dc62,var(--gold));color:#141108;font-weight:800;text-decoration:none;padding:.8rem 1.6rem;border-radius:12px}
.brand{margin-bottom:2rem;font-weight:800;letter-spacing:.14em;color:var(--mute)}
</style>
</head>
<body>
<main>
<div class="brand">TSS · THE SWIFT STORE</div>
<div class="n">404</div>
<h1>Essa página não existe</h1>
<p>O link pode estar errado ou o jogo foi removido da loja.</p>
<a class="b" href="/">Voltar à loja</a>
</main>
</body>
</html>
